title: hanjiung
description: hanjiung의 보안 프로젝트 및 CTF·워게임 기록
locale: ko-KR
url: "https://hanjiung.github.io"
baseurl: ""
repository: hanjiung/hanjiung.github.io

collections:
  projects:
    output: true
    permalink: /projects/:name/
  writeups:
    output: true
    permalink: /writeups/:name/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
  - scope:
      path: ""
      type: writeups
    values:
      layout: single

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
