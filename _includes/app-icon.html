{%- case include.icon -%}

    <span class="art folder" aria-hidden="true"><i></i></span>
  {%- when 'notebook' -%}
    <span class="art notebook" aria-hidden="true"></span>
  {%- when 'desktop' -%}

  {%- when 'profile' -%}
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.7"/><path d="M4.5 20c.7-4.4 3.5-6.7 7.5-6.7s6.8 2.3 7.5 6.7"/></svg>
  {%- when 'git' -%}
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M7 7.3v9.4m10.8-6.3c-.6 4.9-5.4 5.7-10.5 6.4"/></svg>
