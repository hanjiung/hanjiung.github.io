<header class="titlebar">
  <div class="window-controls" hidden>
    <button type="button" data-control="close" aria-label="{{ include.title }} 창 닫기"><span aria-hidden="true">×</span></button>
    <button type="button" data-control="minimize" aria-label="{{ include.title }} 창 최소화"><span aria-hidden="true">−</span></button>
    <button type="button" data-control="zoom" aria-pressed="false" aria-label="{{ include.title }} 창 크게 보기"><span aria-hidden="true">⤢</span></button>
  </div>
  <span class="window-title" lang="en">{% include app-icon.html icon=include.icon %}{{ include.name | escape }}</span>
</header>
